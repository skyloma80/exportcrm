name: Deploy to VPS
on:
  push:
    branches: [ master ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USER }}/crm:latest
  GHCR_IMAGE: ghcr.io/${{ github.repository }}:latest

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # 1. 从 GitHub Secrets 生成 .env.production（build 时需要 NEXT_PUBLIC_* 变量）
      - name: Create .env.production from secrets
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          echo "$ENV_PRODUCTION" > .env.production

      # 2. 登录 Docker Hub & GitHub Container Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 构建并推送镜像到两个仓库
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}

      # 4. 部署配置文件至服务器
      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf,.env.production"
          target: "/home/ubuntu/exportcrm"
          strip_components: 0

      # 5. 拷贝 PocketBase 迁移文件
      - name: Copy PocketBase migrations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "pocketbase/pb_migrations/*"
          target: "/home/ubuntu/exportcrm/pocketbase/pb_migrations"
          strip_components: 1

      # 6. 远程部署（从 GHCR 拉取，中国服务器可访问）
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_IMAGE,GITHUB_TOKEN
          script: |
            cd /home/ubuntu/exportcrm
            # 登录 GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "skyloma80" --password-stdin
            # 拉取最新镜像
            docker pull $GHCR_IMAGE
            # 重新 tag 为本地名，兼容 docker-compose 默认配置
            docker tag $GHCR_IMAGE crm:latest
            # 重新创建并启动容器
            docker compose up -d --force-recreate
            # 清理旧镜像
            docker image prune -f
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
