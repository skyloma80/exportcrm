name: Deploy to VPS
on:
  push:
    branches: [ master ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USER }}/crm:latest
  GHCR_IMAGE: ghcr.io/${{ github.repository }}:latest
  IMAGE_TAR: ./crm-image.tar.gz

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # 1. 从 GitHub Secrets 生成 .env.production
      - name: Create .env.production from secrets
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          echo "$ENV_PRODUCTION" > .env.production

      # 2. 登录 Docker Hub & GitHub Container Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 构建并加载镜像到本地 Docker
      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: crm:latest

      # 4. 导出镜像为 tar，推送到两个 registry
      - name: Save image & push to registries
        run: |
          docker save crm:latest | gzip > ${{ env.IMAGE_TAR }}
          docker tag crm:latest ${{ env.DOCKER_IMAGE }}
          docker tag crm:latest ${{ env.GHCR_IMAGE }}
          docker push ${{ env.DOCKER_IMAGE }}
          docker push ${{ env.GHCR_IMAGE }}

      # 5. 拷贝配置文件至服务器
      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf,.env.production"
          target: "/home/ubuntu/exportcrm"
          strip_components: 0

      # 6. 拷贝 PocketBase 迁移文件
      - name: Copy PocketBase migrations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "pocketbase/pb_migrations/*"
          target: "/home/ubuntu/exportcrm/pocketbase/pb_migrations"
          strip_components: 1

      # 6.5 部署前备份 PocketBase 数据库
      - name: Backup PocketBase before deploy
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/exportcrm
            mkdir -p backups
            BACKUP_NAME="pb_backup_$(date +%Y%m%d_%H%M%S).zip"
            docker exec pb ./pocketbase backup "./backups/${BACKUP_NAME}" || \
            echo "WARN: Backup failed, proceeding with deploy"
            echo "Backup: ${BACKUP_NAME}"

      # 7. SCP 镜像 tar 包到服务器
      - name: Copy image tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.IMAGE_TAR }}"
          target: "/home/ubuntu/exportcrm/"

      # 8. 远程加载镜像并部署
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/exportcrm
            docker load -i crm-image.tar.gz
            docker compose up -d --force-recreate
            docker image prune -f
            rm -f crm-image.tar.gz

      # 9. 部署后健康检查
      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Waiting for services to start..."
            sleep 20
            # 检查 PocketBase
            PB_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8091/api/health || echo "000")
            echo "PocketBase health: $PB_STATUS"
            # 检查 Next.js
            APP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3333/ || echo "000")
            echo "Next.js health: $APP_STATUS"
            if [ "$PB_STATUS" != "200" ] || [ "$APP_STATUS" != "200" ]; then
              echo "WARNING: Health check failed! PB=$PB_STATUS APP=$APP_STATUS"
              exit 1
            fi
            echo "All services healthy."
