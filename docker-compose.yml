services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "3333:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs
    networks:
      - exportcrm-network

  nextjs:
    image: ${DOCKER_IMAGE:-crm:latest}
    container_name: crm
    restart: unless-stopped
    expose:
      - "3333"
    env_file:
      - .env.production
    depends_on:
      pocketbase:
        condition: service_healthy
    networks:
      - exportcrm-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3333/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.35.0
    container_name: pb
    restart: unless-stopped
    ports:
      - "8091:8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
      - ./pocketbase/pb_hooks:/pb_hooks
    networks:
      - exportcrm-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: exportcrm
      MINIO_ROOT_PASSWORD: exportcrm2025
    volumes:
      - exportcrm_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - exportcrm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  exportcrm-network:
    driver: bridge

volumes:
  exportcrm_minio_data:
